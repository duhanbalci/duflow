[package]
name = "duflow-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "duflow"
path = "src/main.rs"

[dependencies]
duflow-core = { path = "../duflow-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
# self-update: GitHub Releases, ureq+rustls (reqwest'e göre çok daha hafif derleme, musl'da sorunsuz)
self_update = { version = "1.3", default-features = false, features = ["ureq", "rustls", "github", "archive-tar", "compression-tar-gz"] }
